    annotations:
      alm-examples: |-
        [
          {
            "apiVersion": "local.storage.openshift.io/v1",
            "kind": "LocalVolume",
            "metadata": {
              "name": "example"
            },
            "spec": {
              "nodeSelector": {
                "nodeSelectorTerms": [
                  {
                    "matchExpressions": [
                      {
                        "key": "kubernetes.io/hostname",
                        "operator": "In",
                        "values": [
                          "worker-0",
                          "worker-1"
                        ]
                      }
                    ]
                  }
                ]
              },
              "storageClassDevices": [
                {
                  "devicePaths": [
                    "/dev/disk/by-id/ata-crucial"
                  ],
                  "fsType": "ext4",
                  "storageClassName": "foobar",
                  "volumeMode": "Filesystem"
                }
              ]
            }
          },
          {
            "apiVersion": "local.storage.openshift.io/v1alpha1",
            "kind": "LocalVolumeSet",
            "metadata": {
              "name": "example-localvolumeset"
            },
            "spec": {
              "deviceInclusionSpec": {
                "deviceMechanicalProperties": [
                  "Rotational",
                  "NonRotational"
                ],
                "deviceTypes": [
                  "disk"
                ],
                "maxSize": "100G",
                "minSize": "10G"
              },
              "maxDeviceCount": 10,
              "nodeSelector": {
                "nodeSelectorTerms": [
                  {
                    "matchExpressions": [
                      {
                        "key": "kubernetes.io/hostname",
                        "operator": "In",
                        "values": [
                          "worker-0",
                          "worker-1"
                        ]
                      }
                    ]
                  }
                ]
              },
              "storageClassName": "example-storageclass",
              "volumeMode": "Block"
            }
          },
          {
            "apiVersion": "local.storage.openshift.io/v1alpha1",
            "kind": "LocalVolumeDiscovery",
            "metadata": {
              "name": "auto-discover-devices"
            },
            "spec": {
              "nodeSelector": {
                "nodeSelectorTerms": [
                  {
                    "matchExpressions": [
                      {
                        "key": "kubernetes.io/hostname",
                        "operator": "In",
                        "values": [
                          "worker-0",
                          "worker-1"
                        ]
                      }
                    ]
                  }
                ]
              }
            }
          }
        ]
